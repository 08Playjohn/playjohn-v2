<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>08 Play John - Novedades Gamer</title>
    
    <!-- Tipografía moderna -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <!-- Librería Font Awesome Oficial para los Logos -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <!-- Tu diseño original -->
    <link rel="stylesheet" href="style.css?v=1.4">
</head>
<body>

    <!-- 1. BARRA SUPERIOR DE MARCAS Y CONTACTO -->
    <div class="top-bar">
        <div class="top-bar-brands">
            <span>INTEL</span> | <span>AMD</span> | <span>NVIDIA</span> | <span>ASUS</span> | <span>MSI</span>
        </div>
        <div class="top-bar-contact">
            <span>🛠️ Soporte Técnico Especializado</span>
        </div>
    </div>

    <!-- 2. MENÚ PRINCIPAL CON BUSCADOR, REDES Y ACCESOS -->
    <header class="main-header">
        <div class="header-container">
            
            <!-- Logo a la Izquierda -->
            <div class="logo-area">
                <a href="index.html" class="logo-text">08 PLAY JOHN</a>
            </div>

            <!-- Buscador en el Centro -->
            <div class="search-area">
                <input type="text" placeholder="Buscar en 08 Play John...">
                <button type="submit" class="search-btn">🔍</button>
            </div>

            <!-- Zona de Redes y Accesos Alineados a la Derecha -->
            <div class="right-actions">
                
                <!-- Bloque Redes Sociales Completo con Enlaces Configurados -->
                <div class="social-block">
                    <div class="social-title">Nuestras<br>Redes</div>
                    
                    <!-- Enlace Real a tu WhatsApp -->
                    <a href="https://wa.me" target="_blank" class="social-icon" title="Escribinos por WhatsApp">
                        <i class="fa-brands fa-whatsapp" style="color: #ffffff; font-size: 24px;"></i>
                    </a>
                    
                    <!-- Enlace Real a tu Instagram -->
                    <a href="https://instagram.com" target="_blank" class="social-icon" title="Seguinos en Instagram">
                        <i class="fa-brands fa-instagram" style="color: #ffffff; font-size: 24px;"></i>
                    </a>
                </div>

                <!-- Iconos de Cuenta y Carrito -->
                <div class="user-cart-block">
                    <a href="#" class="action-link" title="Mi Cuenta">👤</a>
                    <a href="#" class="action-link" title="Carrito">
                        🛒<span class="cart-badge">0</span>
                    </a>
                </div>

            </div>
        </div>
    </header>

    <!-- 3. SECCIÓN PRINCIPAL: CARRUSEL DE PUBLICIDAD / NOVEDADES -->
    <main class="hero-carousel">
        <div class="carousel-container">
            <!-- Flecha Izquierda -->
            <button class="carousel-arrow prev-arrow">❮</button>
            
            <!-- Zona de las Imágenes (Puedes poner más imágenes aquí abajo respetando el mismo formato) -->
            <div class="carousel-slide">
                <img src="ladrillos-neon.jpg" alt="Publicidad destacada 08 Play John" class="carousel-img">
                <!-- <img src="publicidad2.jpg" alt="Publicidad 2" class="carousel-img"> -->
            </div>
            
            <!-- Flecha Derecha -->
            <button class="carousel-arrow next-arrow">❯</button>
        </div>
    </main>

    <!-- 4. BARRA DE CONFIANZA -->
    <section class="trust-bar">
        <div class="trust-item">
            <span class="trust-icon">🔧</span>
            <p>Soporte Técnico Especializado</p>
        </div>
        <div class="trust-item">
            <span class="trust-icon">🔒</span>
            <p>Compra 100% Segura</p>
        </div>
    </section>

    <!-- 5. BOTÓN FLOTANTE DE WHATSAPP CON TU NÚMERO -->
    <a href="https://wa.me" target="_blank" style="position: fixed; bottom: 25px; right: 25px; background: #25d366; color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; box-shadow: 0px 4px 15px rgba(0,0,0,0.6); z-index: 9999; text-decoration: none;">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <!-- LÓGICA DE MOVIMIENTO PARA LAS IMÁGENES DEL CARRUSEL -->
    <script>
        const slide = document.querySelector('.carousel-slide');
        const images = document.querySelectorAll('.carousel-img');
        const prevBtn = document.querySelector('.prev-arrow');
        const nextBtn = document.querySelector('.next-arrow');

        let index = 0;

        function showImage() {
            if (images.length === 0) return;
            images.forEach(img => img.style.display = 'none');
            images[index].style.display = 'block';
        }

        nextBtn.addEventListener('click', () => {
            if (images.length <= 1) return;
            index++;
            if (index >= images.length) index = 0;
            showImage();
        });

        prevBtn.addEventListener('click', () => {
            if (images.length <= 1) return;
            index--;
            if (index < 0) index = images.length - 1;
            showImage();
        });

        showImage();
    </script>

</body>
</html>
